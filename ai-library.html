<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>북스타 · AI 추천 + 내 주변 도서관에서 찾기</title>
<meta name="description" content="북스타 AI가 책을 추천하고, 내 위치 기준 가까운 도서관에서 그 책을 빌릴 수 있는지까지 찾아드려요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="북스타 · Bookstar">
<meta property="og:title" content="북스타 · AI 추천 + 내 주변 도서관에서 찾기">
<meta property="og:description" content="추천받은 책을 가까운 도서관에서 바로 찾아보세요.">
<meta property="og:image" content="https://bookstar.co.kr/og.png">
<meta property="og:url" content="https://bookstar.co.kr/ai-library.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#1a2942; --ac-dark:#0f1a2e; --ac-soft:#d9dfe9;
  --bg:#f4f3ef; --card:#fff; --tx:#1a2942; --mut:#7c8597; --soft:#475569; --line:#e6e2d8; --gold:#d4a93b;
  --ok:#1f9d63; --no:#c2562f;
  --serif:'Noto Serif KR',serif; --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:340px;background:radial-gradient(120% 100% at 50% -20%,rgba(26,41,66,.06),transparent 70%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 24px}
.hero{text-align:center;padding:64px 0 22px}
.kicker{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--gold);margin-bottom:18px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-1px;line-height:1.32;color:#15151c}
.hero .sub{color:var(--mut);font-size:13.5px;margin-top:13px;line-height:1.6}
.searchwrap{max-width:600px;margin:26px auto 0}
.searchbar{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e7e3da;border-radius:18px;padding:8px 8px 8px 20px;box-shadow:0 10px 34px rgba(40,35,80,.07),0 2px 6px rgba(40,35,80,.03);transition:.18s}
.searchbar:focus-within{border-color:#aab4c6;box-shadow:0 12px 38px rgba(26,41,66,.13)}
.searchbar input{flex:1;border:0;outline:0;font-size:15.5px;background:transparent;color:var(--tx);font-family:inherit;padding:8px 0}
.searchbar input::placeholder{color:#b9b6bf}
.searchbar button{flex:0 0 auto;background:var(--ac);color:#fff;border:0;border-radius:13px;width:48px;height:44px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.searchbar button:hover{background:var(--ac-dark)}
.searchbar button:disabled{opacity:.45}
.chips{display:flex;flex-wrap:nowrap;gap:8px;justify-content:safe center;margin-top:16px;overflow-x:auto;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;font-size:12.5px;color:var(--soft);background:rgba(255,255,255,.7);border:1px solid var(--line);padding:8px 15px;border-radius:999px;cursor:pointer;transition:.14s}
.chip:hover{border-color:var(--ac);color:var(--ac);background:#fff;transform:translateY(-1px)}
/* 위치 바 */
.locbar{max-width:600px;margin:14px auto 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.locbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--ac);font-weight:600;font-size:12.5px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.14s}
.locbtn:hover{border-color:var(--ac)}
.locbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.regionSel{font-family:inherit;font-size:12.5px;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:#fff;cursor:pointer}
.locstat{width:100%;text-align:center;font-size:11.5px;color:var(--mut);margin-top:2px}
#stage{margin-top:18px;padding-bottom:80px}
.loading{text-align:center;color:var(--mut);font-size:13.5px;padding:60px 0}
.pulse{display:inline-block;width:32px;height:32px;border:2.5px solid #e8e5dd;border-top-color:var(--ac);border-radius:50%;animation:spin .75s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.results{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.5;letter-spacing:-.4px;color:#23222b;text-align:center;max-width:600px;margin:14px auto 4px}
.modeline{font-size:11px;letter-spacing:.4px;color:var(--mut);text-align:center;margin-bottom:26px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:580px){.grid{grid-template-columns:1fr 1fr}}
.card{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(40,35,80,.1);border-color:#e4e0d7}
.card .cv{flex:0 0 96px;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:#efece6;box-shadow:0 6px 16px rgba(30,25,60,.18)}
.card .cv img{width:100%;height:100%;object-fit:cover}
.card .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.card h3{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.32}
.card .au{font-size:11.5px;color:var(--mut);margin:5px 0 8px}
.card .meta{font-size:11.5px;color:var(--soft)}
.card .meta .star{color:var(--gold);font-weight:700}
.card .why{margin-top:auto;padding-top:10px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:12.5px;line-height:1.6;color:#4a4853;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:50px 0;line-height:1.7}
.foot{font-size:10.5px;color:#c4c0b8;margin-top:30px;line-height:1.6;text-align:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,30,.44);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.ov.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:500px;border-radius:26px 26px 0 0;padding:28px 26px 34px;max-height:88vh;overflow-y:auto;overflow-x:hidden;animation:up .3s cubic-bezier(.2,.7,.2,1);scrollbar-width:thin;scrollbar-color:#e0dcd2 transparent}
.sheet::-webkit-scrollbar{width:6px}
.sheet::-webkit-scrollbar-track{background:transparent;margin:14px 0}
.sheet::-webkit-scrollbar-thumb{background:#e2ded4;border-radius:99px}
.sheet::-webkit-scrollbar-thumb:hover{background:#cfc9bc}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
@media(min-width:560px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet .top{display:flex;gap:18px;margin-bottom:14px}
.sheet .cv{flex:0 0 100px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-shadow:0 10px 26px rgba(30,25,60,.22)}
.sheet .cv img{width:100%;height:100%;object-fit:cover}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.5px;line-height:1.32}
.sheet .au{color:var(--mut);font-size:12.5px;margin:8px 0 10px}
.sheet .meta{font-size:12px;color:var(--soft)}.sheet .meta .star{color:var(--gold);font-weight:700}
.sheet .meta .dot{color:#d2cdc2;margin:0 4px}
.sheet .why{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.55;color:#1f1e27;border-left:3px solid var(--gold);padding:3px 0 3px 14px;margin:16px 0 4px}
.sheet .desclbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin:18px 0 7px}
.sheet .desc{font-size:13.5px;line-height:1.85;color:#44434d;margin:0 0 6px;white-space:pre-line}
.acts{display:flex;gap:9px;margin-top:6px}
.cta{flex:1;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:15px;font-size:14px;font-weight:600;letter-spacing:-.2px;cursor:pointer;transition:.15s}
.cta:hover{background:var(--ac-dark)}
.cta:disabled{opacity:.45}
.cta2{background:transparent;color:var(--mut);border:1px solid #ecebe3;border-radius:12px;padding:15px 18px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
.cta2:hover{color:var(--soft);border-color:#dcd9cf}
/* 도서관 결과 */
.libwrap{margin-top:16px}
.libhd{font-size:11.5px;font-weight:600;color:var(--soft);margin-bottom:12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;letter-spacing:-.1px}
.distlink{font-weight:600;color:var(--mut);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.distlink:hover{color:var(--ac)}
.shelfhint{font-size:12px;color:var(--soft);background:#faf9f6;border-left:2px solid var(--gold);border-radius:0 9px 9px 0;padding:10px 14px;margin-bottom:14px;line-height:1.55}
.shelflbl{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;margin-right:8px;vertical-align:1px}
.shelfval{color:var(--ac);font-weight:600}
.shelfhint .sub{display:block;font-size:11px;color:#6e7687;margin-top:5px}
.formats{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;padding:13px 15px;background:#f7f6fb;border:1px solid #ecebf3;border-radius:13px}
.fmthd{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin-bottom:1px}
.fmtrow{font-size:12.5px;color:var(--soft);line-height:1.5;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fmtlbl{flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.fmtlbl.paper{background:rgba(79,70,229,.1);color:#4f46e5}
.fmtlbl.ebook{background:rgba(184,134,11,.14);color:#b07d0a}
.fmtrow a{color:#4f46e5;font-weight:600;text-decoration:none}
.fmtrow a:hover{text-decoration:underline}
.fmtnote{font-size:10.5px;color:var(--mut)}
.libs{display:flex;flex-direction:column;gap:8px}
.libitem{border:1px solid #efece4;border-radius:13px;padding:13px 15px;background:#fff;transition:.15s}
.libitem:hover{border-color:#e2ddd1;box-shadow:0 4px 14px rgba(40,35,80,.04)}
.libtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.libname{font-size:14px;font-weight:700;color:#4f46e5;letter-spacing:-.3px}
.libdist{flex:0 0 auto;font-size:12px;font-weight:700;color:#4f46e5}
.libaddr{font-size:12px;color:#586273;margin:4px 0 9px;line-height:1.5}
.librow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.2px}
.badge.ok{background:rgba(31,157,99,.1);color:var(--ok)}
.badge.no{background:rgba(194,86,47,.1);color:var(--no)}
.badge.unk{background:#f0efea;color:#9a958a}
.liblink{font-size:12px;color:var(--soft);text-decoration:none;font-weight:500;transition:.14s}
.liblink:hover{color:#4f46e5}
.liblink.accent{color:#4f46e5;font-weight:600}
.ebookline{margin-top:14px;font-size:12px;color:var(--soft);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px}
.ebookline a{color:var(--ac);font-weight:600;text-decoration:none}
.src{font-size:10.5px;color:#c4c0b8;margin-top:15px;line-height:1.5}
</style></head><body>
<div class=wrap>
  <div class=hero>
    <div class=kicker>BOOKSTAR</div>
    <h1>추천받고, 순천 도서관에서 바로 찾기</h1>
    <div class=sub>북스타 AI가 책을 골라주면 — 순천시 도서관에 그 책이 있는지·빌릴 수 있는지 알려드려요 (위치를 켜면 가까운 순서로)</div>
    <div class=searchwrap>
      <div class=searchbar>
        <input id=q placeholder="예: 요즘 지쳐서 위로가 되는 책" onkeydown="if(event.key=='Enter')go()">
        <button id=send onclick=go()>→</button>
      </div>
      <div class=chips id=chips></div>
    </div>
  </div>
  <div id=stage></div>
  <div class=foot>표지·별점 알라딘 · 추천 북스타 AI · 도서관 소장·대출 정보나루(국립중앙도서관)</div>
</div>
<div class=ov id=ov onclick="if(event.target.id=='ov')closeM()"><div class=sheet id=sheet></div></div>
<script>
const REC="https://gkujptyfrzqrjrvovbnc.supabase.co/functions/v1/recommend";
const LIB="https://gkujptyfrzqrjrvovbnc.supabase.co/functions/v1/find-in-library";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdWpwdHlmcnpxcmpydm92Ym5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjI0MDcsImV4cCI6MjA5NTczODQwN30.BphB9N1xjfOgrGCPiqwFQNbwotu1HW7fBTDl4sdQSTc";
const EXAMPLES=["요즘 지쳐서 위로받고 싶어","가볍게 머리 식힐 책","오싹하고 무서운 이야기","우주와 과학이 궁금해","철학 입문하고 싶어","김애란 책"];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f5=r=>r==null?'':(Math.round(r/2*10)/10).toFixed(1);
const man=n=>{if(!n)return '';if(n>=10000)return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만';return n.toLocaleString();};
// 검색 도서관 한정: 순천시 (city=주소필터, region=36 전남). 풀려면 LOCK=null.
// ebook = 그 지역 도서관 실제 전자책 플랫폼. 순천 = 교보문고 전자도서관(소장형). 정회원 로그인 후 대출.
const LOCK={city:'순천', region:'36', label:'순천시', ebook:'https://suncheonlib.dkyobobook.co.kr', ebookName:'순천 교보 전자도서관'};
let LAST=[], CURRENT=null, MYLOC=null;
document.getElementById('chips').innerHTML=EXAMPLES.map(e=>`<span class=chip onclick="run('${e}')">${e}</span>`).join('');
function run(t){document.getElementById('q').value=t;go();}

/* ---- 위치 ---- */
// 위치는 선택 — 결과의 '가까운 순 보기'에서만 호출. 잡히면 거리 반영해 새로고침
function getLoc(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{
    MYLOC={lat:p.coords.latitude,lng:p.coords.longitude};
    if(document.getElementById('ov').classList.contains('on') && CURRENT && CURRENT.isbn13) findLib();
  },()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
}

/* ---- 추천 ---- */
async function go(){
  const q=document.getElementById('q').value.trim(); if(!q)return;
  const st=document.getElementById('stage');
  document.getElementById('send').disabled=true;
  st.innerHTML='<div class=loading><div class=pulse></div><br>북스타 AI가 책을 고르는 중…</div>';
  try{
    const r=await fetch(REC,{method:'POST',headers:{'Authorization':'Bearer '+ANON,'apikey':ANON,'content-type':'application/json'},body:JSON.stringify({query:q})});
    const d=await r.json(); LAST=d.results||[]; render(d);
  }catch(e){ st.innerHTML='<div class=empty>잠시 문제가 생겼어요. 다시 시도해 주세요.</div>'; }
  document.getElementById('send').disabled=false;
}
function card(b,i){
  const star=b.rating!=null?`<span class=star>★</span> ${f5(b.rating)}`:'';
  const loan=b.loan_count?`  ·  대출 ${man(b.loan_count)}`:'';
  return `<div class=card onclick="openM(${i})">
    <div class=cv><img src="${esc(b.cover)}" loading=lazy onerror="this.style.opacity=0"></div>
    <div class=bd><h3>${esc(b.title)}</h3><div class=au>${esc(b.author)}</div>
      <div class=meta>${star}${loan}</div>
      ${b.reason?`<div class=why>${esc(b.reason)}</div>`:''}
    </div></div>`;
}
function render(d){
  const st=document.getElementById('stage');
  if(!d.results||!d.results.length){st.innerHTML='<div class=empty>딱 맞는 책을 못 찾았어요.<br>조금 다르게 말해보거나 예시를 눌러보세요.</div>';return;}
  const modeTxt=d.mode==='entity'?'정확 검색 · 도서관 DB':'북스타 AI 큐레이션';
  st.innerHTML=`<div class=results><div class=intro>${esc(d.intro||'')}</div><div class=modeline>${modeTxt} · ${d.results.length}권 · 책을 누르면 가까운 도서관을 찾아드려요</div><div class=grid>${d.results.map(card).join('')}</div></div>`;
}

/* ---- 상세 + 도서관 찾기 ---- */
function openM(i){const b=LAST[i];if(!b)return; CURRENT=b;
  const star=b.rating!=null?`<span class=star>★</span> ${f5(b.rating)} <span class=dot>·</span> ${b.rating_count||0}명`:'';
  const loan=b.loan_count?`<span class=dot>·</span> 대출 ${man(b.loan_count)}`:'';
  const page=b.pages?`<span class=dot>·</span> ${b.pages}쪽`:'';
  const hasIsbn=!!b.isbn13;
  document.getElementById('sheet').innerHTML=`<div class=top><div class=cv><img src="${esc(b.cover)}" onerror="this.style.opacity=0"></div>
    <div style="flex:1"><h2>${esc(b.title)}</h2><div class=au>${esc(b.author)} · ${esc(b.publisher||'')} ${b.pub_year||''}</div>
    <div class=meta>${star}${loan}${page}</div></div></div>
    ${b.reason?`<div class=why>${esc(b.reason)}</div>`:''}
    ${b.description?`<div class=desclbl>책 소개</div><p class=desc>${esc(b.description)}</p>`:''}
    <div class=acts>
      <button class=cta id=findBtn ${hasIsbn?'':'disabled'} onclick=findLib()>${LOCK?LOCK.label:''} 도서관에서 찾기</button>
      <button class=cta2 onclick=closeM()>닫기</button>
    </div>
    <div id=libResult></div>
    <div class=src>종이책 소장·대출 가능 여부 · 정보나루(국립중앙도서관) 실시간 / 전자책 · ${esc(LOCK&&LOCK.ebookName||'전자도서관')}</div>`;
  document.getElementById('ov').classList.add('on');
}
async function findLib(){
  if(!CURRENT||!CURRENT.isbn13)return;
  const btn=document.getElementById('findBtn'); if(btn){btn.disabled=true; btn.textContent='도서관 찾는 중…';}
  const res=document.getElementById('libResult');
  res.innerHTML='<div class=loading style="padding:24px 0"><div class=pulse></div></div>';
  try{
    const payload={isbn:CURRENT.isbn13,limit:8};
    if(LOCK){payload.region=LOCK.region; payload.city=LOCK.city;}
    if(MYLOC){payload.lat=MYLOC.lat; payload.lng=MYLOC.lng;}
    const r=await fetch(LIB,{method:'POST',headers:{'Authorization':'Bearer '+ANON,'apikey':ANON,'content-type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    renderLibs(d);
  }catch(e){ res.innerHTML='<div class=ebookline>도서관 조회에 문제가 생겼어요. 다시 시도해 주세요.</div>'; }
  if(btn){btn.disabled=false; btn.textContent=`${LOCK?LOCK.label:''} 도서관에서 찾기`;}
}
// 종이책 + 전자책 '이용 방법' 통합 요약 (정식 연동 시 전자책도 실시간 표시)
function formatsBox(d){
  const area=LOCK?LOCK.label:esc(d&&d.regionName||'');
  const paperN=(d&&d.libraries&&d.libraries.length)?(d.total||d.libraries.length):0;
  const paper=paperN
    ? `<div class=fmtrow><span class="fmtlbl paper">종이책</span><span>${area} <b>${paperN}곳</b> 소장 · 아래에서 도서관·대출가능 확인</span></div>`
    : `<div class=fmtrow><span class="fmtlbl paper">종이책</span><span>${area} 소장 없음</span></div>`;
  const ebook=(LOCK&&LOCK.ebook)
    ? `<div class=fmtrow><span class="fmtlbl ebook">전자책</span><span>${esc(LOCK.ebookName||'전자도서관')} <a href="${LOCK.ebook}" target=_blank rel=noopener>바로가기 →</a> <span class=fmtnote>· 연동 시 실시간 대출 가능 여부 표시</span></span></div>`
    : '';
  return `<div class=formats><div class=fmthd>이렇게 빌릴 수 있어요</div>${paper}${ebook}</div>`;
}
function renderLibs(d){
  const res=document.getElementById('libResult');
  const area=LOCK?LOCK.label:esc(d&&d.regionName||'');
  if(!d || !d.libraries || !d.libraries.length){
    res.innerHTML=`${formatsBox(d)}<div class=ebookline>${area}에는 이 책을 <b>종이책</b>으로 소장한 도서관이 없어요. 전자책으로 찾아보세요.</div>`;
    return;
  }
  const useDist=!!d.usedLocation;
  const items=d.libraries.map(l=>{
    const dist=(useDist && l.distance!=null)?`${l.distance}km`:'';
    const av=l.loanAvailable===true?'<span class="badge ok">대출 가능</span>'
            :l.loanAvailable===false?'<span class="badge no">대출 중</span>'
            :'<span class="badge unk">소장</span>';
    const map=`https://map.kakao.com/?q=${encodeURIComponent(l.name||l.address||'')}`;
    const tel=l.tel&&l.tel!=='-'?`<a class=liblink href="tel:${esc(l.tel)}">전화</a>`:'';
    const hp=l.homepage?`<a class="liblink accent" href="${esc(l.homepage)}" target=_blank rel=noopener>소장위치 보기 →</a>`:'';
    return `<div class=libitem>
      <div class=libtop><span class=libname>${esc(l.name)}</span>${dist?`<span class=libdist>${dist}</span>`:''}</div>
      <div class=libaddr>${esc(l.address)}</div>
      <div class=librow>${av}<a class=liblink href="${map}" target=_blank rel=noopener>지도</a>${tel}${hp}</div>
    </div>`;
  }).join('');
  // 서가 분류(KDC) 힌트 — 책마다 동일하므로 목록 위에 한 번
  const kdcInt=d.kdc?String(d.kdc).split('.')[0]:'';
  const shelf=(d.kdcName||kdcInt)
    ? `<div class=shelfhint><span class=shelflbl>서가 위치</span><span class=shelfval>${esc(d.kdcName||'')}${kdcInt?` · ${kdcInt}번 서가`:''}</span>
        <span class=sub>책은 이 분류번호 순서로 꽂혀 있어요. 정확한 칸은 각 도서관 ‘소장위치 보기’에서 확인.</span></div>`
    : '';
  const hd=useDist
    ? `종이책 — 내 위치에서 가까운 순`
    : `종이책 소장 도서관 · <a class=distlink onclick=getLoc()>가까운 순 보기</a>`;
  res.innerHTML=`${formatsBox(d)}${shelf}<div class=libwrap><div class=libhd>${hd}</div><div class=libs>${items}</div></div>`;
}
function closeM(){document.getElementById('ov').classList.remove('on');}
</script></body></html>
