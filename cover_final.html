<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>표지 최종 비교 — F vs 메밀꽃 감성</title>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--line:#e7e2d6;--ink:#20242c;--sub:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;line-height:1.5;padding:0 0 60px;}
  header{padding:30px 20px 18px;text-align:center;border-bottom:1px solid var(--line);background:var(--card);}
  header h1{font-size:22px;font-weight:900;letter-spacing:-.5px;}
  header p{font-size:13.5px;color:var(--sub);margin-top:8px;}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}
  .book{margin-top:34px;}
  .book-name{font-size:19px;font-weight:800;margin:0 4px 10px;}
  .book-name small{font-size:13px;font-weight:600;color:var(--sub);margin-left:8px;}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);}
  .cell.mood{outline:2px solid #7c6cc433;}
  .cell .tag{font-size:13px;font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);}
  .cell.f .tag{color:#166534;} .cell.mood .tag{color:#6d28d9;}
  .cell .tag em{font-style:normal;font-weight:600;color:var(--sub);font-size:11.5px;margin-left:6px;}
  .cell img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#eee;}
  footer{text-align:center;color:var(--sub);font-size:12.5px;margin-top:44px;padding:0 20px;}
</style>
</head>
<body>
<header>
  <h1>한국 고전 표지 — 최종 후보 비교</h1>
  <p>왼쪽 <b>F · 사실적 유화</b>(지금 앱 라이브) &nbsp;vs&nbsp; 오른쪽 <b>메밀꽃 감성</b>(달빛·글로우 몽환). 어느 쪽이 좋은지 봐주세요.</p>
</header>
<div class="wrap" id="grid"></div>
<footer>북스타 · 내부 최종 비교용 (검색 노출 안 됨)</footer>
<script>
  const V='?v='+Date.now();
  const BOOKS=[
    {name:'봉별기', author:'이상', slug:'kr-bongbyeolgi'},
    {name:'무정', author:'이광수', slug:'kr-mujeong-el'},
    {name:'물레방아', author:'나도향', slug:'kr-mulrebanga'},
    {name:'별을 안거든', author:'나도향', slug:'kr-byeoleulangeodeun'},
    {name:'소금', author:'강경애', slug:'kr-sogeum'},
  ];
  document.getElementById('grid').innerHTML = BOOKS.map(b=>`
    <div class="book">
      <div class="book-name">${b.name}<small>${b.author}</small></div>
      <div class="pair">
        <div class="cell f"><div class="tag">F · 사실적 유화 <em>지금 라이브</em></div>
          <img loading="lazy" src="covers/${b.slug}.webp${V}" alt="${b.name} F"></div>
        <div class="cell mood"><div class="tag">메밀꽃 감성 <em>달빛·글로우 ✨</em></div>
          <img loading="lazy" src="covers/_try_mood_${b.slug}.webp${V}" alt="${b.name} 감성"></div>
      </div>
    </div>`).join('');
</script>
</body>
</html>
