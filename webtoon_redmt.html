<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>붉은 산 — 웹툰 · bookstar</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#08080c;color:#f4efe6;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;}
  .serif{font-family:Georgia,'Noto Serif KR',serif;}
  .wt-bar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(8,8,12,.7);backdrop-filter:blur(8px);z-index:50;border-bottom:1px solid rgba(255,255,255,.08);}
  .wt-bar a.back{color:#f4efe6;text-decoration:none;font-size:20px;line-height:1;padding:4px 6px;}
  .wt-bar .ti{font-weight:800;font-size:15px;}
  .wt-bar .au{font-size:12px;color:#b3aa98;}
  .wt-bar .demo{margin-left:auto;font-size:10.5px;font-weight:800;color:#1a1f33;background:#e8c66a;padding:3px 9px;border-radius:20px;}
  .wt-prog{position:fixed;top:52px;left:0;height:3px;background:#e8c66a;width:0;z-index:50;transition:width .1s;}
  .wt-col{max-width:480px;margin:0 auto;padding-top:52px;}
  .wt-cover{position:relative;min-height:100vh;}
  .wt-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .wt-cover .scr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,12,.35),rgba(8,8,12,0) 35%,rgba(8,8,12,.85));}
  .wt-cover .tx{position:absolute;left:0;right:0;bottom:64px;text-align:center;padding:0 24px;z-index:2;}
  .wt-cover h1{font-size:62px;letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.7);}
  .wt-cover .sub{margin-top:12px;font-size:14px;color:#e6cfa0;letter-spacing:2px;}
  .wt-cover .au2{margin-top:6px;font-size:13px;color:#cdbfa6;}
  .wt-cover .scroll{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:12px;color:#cfc6b6;z-index:2;animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
  .wt-cut{position:relative;display:flex;justify-content:center;background:#08080c;}
  .wt-cut img{display:block;width:auto;max-width:100%;max-height:calc(100vh - 56px);opacity:0;transform:scale(1.04);transition:opacity 1s ease,transform 1.4s ease;}
  .wt-cut.in img{opacity:1;transform:none;}
  .wt-cut .scr{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,rgba(8,8,12,0),rgba(8,8,12,.55) 55%,rgba(8,8,12,.94));pointer-events:none;}
  .wt-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 30px;z-index:3;font-size:17px;line-height:1.85;letter-spacing:-.2px;text-shadow:0 1px 8px rgba(0,0,0,.7);opacity:0;transform:translateY(20px);transition:opacity .8s .15s,transform .8s .15s;}
  .wt-cut.in .wt-cap{opacity:1;transform:none;}
  .wt-cap .dlg{color:#ffd87a;font-weight:700;}
  .wt-cap .small{display:block;font-size:13.5px;color:#cabfae;margin-top:6px;}
  .wt-end{text-align:center;padding:70px 24px 90px;background:radial-gradient(120% 80% at 50% 30%,#1a1430,#08080c 70%);}
  .wt-end .fin{font-size:30px;letter-spacing:8px;color:#e6cfa0;margin-bottom:18px;}
  .wt-end p{color:#c2b9a8;font-size:14px;line-height:1.85;max-width:420px;margin:0 auto 20px;}
  .wt-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .wt-btn{display:inline-block;text-decoration:none;font-weight:800;font-size:14px;border-radius:12px;padding:13px 20px;}
  .wt-btn.gold{background:#e8c66a;color:#1a1f33;}
  .wt-btn.ghost{background:transparent;color:#f4efe6;border:1px solid rgba(255,255,255,.25);}
  .wt-note{font-size:11.5px;color:#8a8377;max-width:440px;margin:26px auto 0;line-height:1.7;}
  @media(max-width:520px){.wt-cover h1{font-size:48px;}.wt-cap{font-size:15.5px;}}
</style>
</head>
<body>
<div class="wt-bar">
  <a class="back" href="/app.html?page=collection" title="북스타로">←</a>
  <div class="ti">붉은 산</div><div class="au">· 김동인</div>
  <div class="demo">AI 웹툰</div>
</div>
<div class="wt-prog" id="prog"></div>

<div class="wt-col">
  <section class="wt-cover">
    <img src="webtoon/redmt/00_cover.png?v=260614n" alt="붉은 산">
    <div class="scr"></div>
    <div class="tx">
      <h1 class="serif">붉은 산</h1>
      <div class="sub">— 어떤 의사의 手記 —</div>
      <div class="au2">원작 김동인 · bookstar AI 웹툰</div>
    </div>
    <div class="scroll">아래로 스크롤 ↓</div>
  </section>
  <div id="strip"></div>
  <section class="wt-end">
    <div class="fin serif">끝</div>
    <p>광막한 겨울의 만주 벌판, 밥버러지라 멸시받던 익호의 죽음을 조상하는 숭엄한 노래가 울렸다. 그 가운데 그의 몸은 점점 식어갔다.</p>
    <div class="wt-row">
      <a class="wt-btn gold" href="/app.html?page=collection">📖 원작 전문 읽기</a>
      <a class="wt-btn ghost" href="/app.html">북스타 홈</a>
    </div>
    <div class="wt-note">원작은 저작권 만료(PD) 작품입니다. 그림은 bookstar AI(Nano Banana)로 제작한 데모 작화입니다.</div>
  </section>
</div>

<script>
const SLUG="redmt", VER="260614n";
const CUTS=[{"img": "01", "c": "의사인 ‘나’는 만주의 풍속과 병을 살피러, 노새에 올라 끝없는 벌판을 떠돌았다."}, {"img": "02", "c": "산 하나 보이지 않는 광막한 벌판 한가운데, 조선 소작인 스무남은 호가 모여 사는 작은 마을 — ××촌. 순박한 동족들 틈에서 나는 평화로이 머물렀다."}, {"img": "03", "c": "그곳에 ‘삵’이라 불리는 사내, <b>정익호</b>가 있었다. <span class=\"small\">쥐를 닮은 얼굴, 늘 교활함과 독기가 어린 눈.</span>"}, {"img": "04", "c": "투전·싸움·트집·칼부림 — 그는 마을의 커다란 암종이었다. <span class=\"dlg\">“삵이나 죽지 않고…”</span><span class=\"small\">그를 동정하는 사람은 아무도 없었다.</span>"}, {"img": "05", "c": "어느 날, <b>송 첨지</b> 노인이 그해 소출을 나귀에 싣고 만주인 지주의 마을로 갔다."}, {"img": "06", "c": "돌아온 것은 송장이었다. 소출이 적다고 매를 맞아 뼈가 꺾인 채, 나귀 등에 묶여 와 마을에 닿자 숨을 거두었다."}, {"img": "07", "c": "<span class=\"dlg\">“원수를 갚자!”</span> 젊은이들은 발을 굴렀다. 그러나 — 누구도 앞장서려는 사람은 없었다."}, {"img": "08", "c": "검시를 마치고 돌아오던 길, 나는 ‘삵’을 만났다. <span class=\"dlg\">“송 첨지가 죽은 줄 아나?”</span><span class=\"small\">그 얼굴에 얼핏 스친 비창한 표정을, 나는 잊을 수 없었다.</span>"}, {"img": "09", "c": "이튿날 새벽. ‘삵’이 동구 밖 밭고랑에 — 허리가 기역자로 꺾인 채 피투성이로 쓰러져 있었다."}, {"img": "10", "c": "멸시받던 그가, 홀로 원수에게 달려갔던 것이다. <span class=\"dlg\">“선생님, 저는… 그 놈, 지주 놈의 집에 갔었습니다…”</span>"}, {"img": "11", "c": "죽음에 임하여, 그는 고국을 떠올렸다. <span class=\"dlg\">“보고 싶어요. 붉은 산이 — 그리고 흰 옷이!”</span>"}, {"img": "12", "c": "<span class=\"dlg\">“선생님, 노래를… 동해물과 백두산이…”</span> 내가 눈을 감고 부르자, 둘러선 이들의 입에서도 숭엄한 합창이 만주 벌판 위로 울려 퍼졌다."}];
document.getElementById('strip').innerHTML=CUTS.map(x=>`<section class="wt-cut"><img src="webtoon/${SLUG}/${x.img}.png?v=${VER}" alt="" loading="lazy"><div class="scr"></div><div class="wt-cap serif">${x.c}</div></section>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');}),{threshold:.18});
document.querySelectorAll('.wt-cut').forEach(s=>io.observe(s));
const prog=document.getElementById('prog');
addEventListener('scroll',()=>{const h=document.documentElement;prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';},{passive:true});
</script>
</body>
</html>
