<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>한국 고전 표지 — 전체</title>
<style>body{margin:0;background:#14121c;color:#e8e4f0;font-family:-apple-system,'Malgun Gothic',sans-serif;padding:20px}h1{font-size:20px;text-align:center;margin:8px 0 4px}p.sub{text-align:center;color:#a99fc0;font-size:13px;margin:0 0 20px;line-height:1.6}.grid{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.card{background:#1e1a2c;border-radius:10px;overflow:hidden}.card img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#2a2438}.card .t{padding:7px 9px;font-size:11.5px;color:#c4bad8}.badge{display:inline-block;margin-left:5px;font-size:9.5px;background:#3a2f5c;color:#c9bfe6;padding:1px 6px;border-radius:7px}</style></head><body>
<h1>🎨 한국 고전 표지 — 전체 104권</h1>
<p class=sub>AI가 각 책 원문을 읽고 어울리는 스타일 자동 선택 · 메밀꽃/운수 좋은 날은 기존 유지</p>
<div class=grid id=g></div>
<script>
const KO={oil:'유화',watercolor:'수채',moonlit:'달밤',poster:'포스터',modern_flat:'플랫'};
fetch('_multi_all.json?b='+Date.now()).then(r=>r.json()).then(items=>{
document.getElementById('g').innerHTML=items.map(i=>`<div class=card><img loading=lazy src="covers/_try_multi_${i.slug}.webp?b=1" alt="${i.title}"><div class=t>${i.title}<span class=badge>${KO[i.style]||i.style}</span></div></div>`).join('');
});
</script></body></html>
