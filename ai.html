<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>북스타 · Bookstar — 모든 책은 하늘의 별</title>
<meta name="description" content="수많은 책 중, 지금 당신에게 길을 비추는 한 권을 북스타 AI가 찾아드려요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="북스타 · Bookstar">
<meta property="og:title" content="북스타 · 모든 책은 하늘의 별">
<meta property="og:description" content="수많은 책 중, 지금 당신에게 길을 비추는 한 권을 북스타 AI가 찾아드려요.">
<meta property="og:image" content="https://bookstar.co.kr/og.png">
<meta property="og:url" content="https://bookstar.co.kr/ai.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bookstar.co.kr/og.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#4f46e5; --ac-soft:#eef0ff;
  --bg:#faf9f6; --card:#fff; --tx:#191921; --mut:#9c9aa3; --soft:#56545e; --line:#ece9e3; --gold:#be913a;
  --serif:'Noto Serif KR',serif; --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:340px;background:radial-gradient(120% 100% at 50% -20%,rgba(79,70,229,.07),transparent 70%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 24px}
/* hero */
.hero{text-align:center;padding:72px 0 36px}
.kicker{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--ac);margin-bottom:20px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:-1px;line-height:1.32;color:#15151c}
.hero .sub{color:var(--mut);font-size:13.5px;margin-top:14px;line-height:1.6}
/* search */
.searchwrap{max-width:600px;margin:30px auto 0}
.searchbar{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e7e3da;border-radius:18px;padding:8px 8px 8px 20px;box-shadow:0 10px 34px rgba(40,35,80,.07),0 2px 6px rgba(40,35,80,.03);transition:.18s}
.searchbar:focus-within{border-color:#c5c2f0;box-shadow:0 12px 38px rgba(79,70,229,.14)}
.searchbar input{flex:1;border:0;outline:0;font-size:15.5px;background:transparent;color:var(--tx);font-family:inherit;padding:8px 0}
.searchbar input::placeholder{color:#b9b6bf}
.searchbar button{flex:0 0 auto;background:var(--ac);color:#fff;border:0;border-radius:13px;width:48px;height:44px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.searchbar button:hover{background:#4338ca}
.searchbar button:disabled{opacity:.45}
.chips{display:flex;flex-wrap:nowrap;gap:8px;justify-content:safe center;margin-top:18px;overflow-x:auto;padding:2px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;font-size:12.5px;color:var(--soft);background:rgba(255,255,255,.7);border:1px solid var(--line);padding:8px 15px;border-radius:999px;cursor:pointer;transition:.14s;backdrop-filter:blur(4px)}
.chip:hover{border-color:var(--ac);color:var(--ac);background:#fff;transform:translateY(-1px)}
/* stage */
#stage{margin-top:18px;padding-bottom:80px}
.loading{text-align:center;color:var(--mut);font-size:13.5px;padding:60px 0}
.pulse{display:inline-block;width:32px;height:32px;border:2.5px solid #e8e5dd;border-top-color:var(--ac);border-radius:50%;animation:spin .75s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.results{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.5;letter-spacing:-.4px;color:#23222b;text-align:center;max-width:600px;margin:14px auto 4px}
.modeline{font-size:11px;letter-spacing:.4px;color:var(--mut);text-align:center;margin-bottom:26px;text-transform:none}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:580px){.grid{grid-template-columns:1fr 1fr}}
.card{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(40,35,80,.1);border-color:#e4e0d7}
.card .cv{flex:0 0 104px;aspect-ratio:2/3;border-radius:9px;overflow:hidden;background:#efece6;box-shadow:0 6px 16px rgba(30,25,60,.18)}
.card .cv img{width:100%;height:100%;object-fit:cover}
.card .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.card h3{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.32}
.card .au{font-size:11.5px;color:var(--mut);margin:5px 0 8px}
.card .meta{font-size:11.5px;color:var(--soft)}
.card .meta .star{color:var(--gold);font-weight:700}
.card .why{margin-top:auto;padding-top:10px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:12.5px;line-height:1.6;color:#4a4853;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .why::before{content:'“';color:var(--ac);font-weight:700;margin-right:1px}
.card .why::after{content:'”';color:var(--ac);font-weight:700}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:50px 0;line-height:1.7}
.foot{font-size:10.5px;color:#c4c0b8;margin-top:30px;line-height:1.6;text-align:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,30,.44);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.ov.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:500px;border-radius:26px 26px 0 0;padding:28px 26px 34px;max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
@media(min-width:560px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet .top{display:flex;gap:18px;margin-bottom:16px}
.sheet .cv{flex:0 0 112px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-shadow:0 10px 26px rgba(30,25,60,.22)}
.sheet .cv img{width:100%;height:100%;object-fit:cover}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.5px;line-height:1.32}
.sheet .au{color:var(--mut);font-size:12.5px;margin:8px 0 11px}
.sheet .meta{font-size:12px;color:var(--soft)}.sheet .meta .star{color:var(--gold);font-weight:700}
.sheet .why{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.66;color:#3a3942;background:linear-gradient(var(--ac-soft),var(--ac-soft)) no-repeat;background-size:3px 100%;padding:4px 0 4px 16px;margin:16px 0}
.sheet p.desc{font-size:13.5px;line-height:1.78;color:#46454f;margin:16px 0}
.kws{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.kw{font-size:11.5px;color:var(--soft);background:#f4f2ee;padding:5px 11px;border-radius:7px}
.acts{display:flex;gap:9px}
.cta{flex:1;background:var(--ac);color:#fff;border:0;border-radius:13px;padding:14px;font-size:13.5px;font-weight:600;cursor:pointer}
.cta:hover{background:#4338ca}
.cta2{background:#fff;color:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
.src{font-size:10.5px;color:#c4c0b8;margin-top:15px;line-height:1.5}
</style></head><body>
<div class=wrap>
  <div class=hero>
    <div class=kicker>✦ BOOKSTAR</div>
    <h1>어떤 별을 찾고 계신가요?</h1>
    <div class=sub>모든 책은 하늘의 별 — 당신의 한 권을 북스타가 찾아드려요</div>
    <div class=searchwrap>
      <div class=searchbar>
        <input id=q placeholder="예: 요즘 지쳐서 위로가 되는 책" onkeydown="if(event.key=='Enter')go()">
        <button id=send onclick=go()>→</button>
      </div>
      <div class=chips id=chips></div>
    </div>
  </div>
  <div id=stage></div>
  <div class=foot>표지·별점 알라딘 · 대출·키워드 도서관 정보나루(국립중앙도서관) · 추천 북스타 AI</div>
</div>
<div class=ov id=ov onclick="if(event.target.id=='ov')closeM()"><div class=sheet id=sheet></div></div>
<script>
const FUNC="https://gkujptyfrzqrjrvovbnc.supabase.co/functions/v1/recommend";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdWpwdHlmcnpxcmpydm92Ym5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjI0MDcsImV4cCI6MjA5NTczODQwN30.BphB9N1xjfOgrGCPiqwFQNbwotu1HW7fBTDl4sdQSTc";
const EXAMPLES=["요즘 지쳐서 위로받고 싶어","가볍게 머리 식힐 책","오싹하고 무서운 이야기","우주와 과학이 궁금해","철학 입문하고 싶어","김애란 책"];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f5=r=>r==null?'':(Math.round(r/2*10)/10).toFixed(1);
const man=n=>{if(!n)return '';if(n>=10000)return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'만';return n.toLocaleString();};
let LAST=[];
document.getElementById('chips').innerHTML=EXAMPLES.map(e=>`<span class=chip onclick="run('${e}')">${e}</span>`).join('');
function run(t){document.getElementById('q').value=t;go();}
async function go(){
  const q=document.getElementById('q').value.trim(); if(!q)return;
  const st=document.getElementById('stage');
  document.getElementById('send').disabled=true;
  st.innerHTML='<div class=loading><div class=pulse></div><br>북스타 AI가 책을 고르는 중…</div>';
  try{
    const r=await fetch(FUNC,{method:'POST',headers:{'Authorization':'Bearer '+ANON,'apikey':ANON,'content-type':'application/json'},body:JSON.stringify({query:q})});
    const d=await r.json(); LAST=d.results||[]; render(d);
  }catch(e){ st.innerHTML='<div class=empty>잠시 문제가 생겼어요. 다시 시도해 주세요.</div>'; }
  document.getElementById('send').disabled=false;
}
function card(b,i){
  const star=b.rating!=null?`<span class=star>★</span> ${f5(b.rating)}`:'';
  const loan=b.loan_count?`  ·  대출 ${man(b.loan_count)}`:'';
  return `<div class=card onclick="openM(${i})">
    <div class=cv><img src="${esc(b.cover)}" loading=lazy onerror="this.style.opacity=0"></div>
    <div class=bd><h3>${esc(b.title)}</h3><div class=au>${esc(b.author)}</div>
      <div class=meta>${star}${loan}</div>
      ${b.reason?`<div class=why>${esc(b.reason)}</div>`:''}
    </div></div>`;
}
function render(d){
  const st=document.getElementById('stage');
  if(!d.results||!d.results.length){st.innerHTML='<div class=empty>딱 맞는 책을 못 찾았어요.<br>조금 다르게 말해보거나 예시를 눌러보세요.</div>';return;}
  const modeTxt=d.mode==='entity'?'정확 검색 · 도서관 DB':'북스타 AI 큐레이션';
  st.innerHTML=`<div class=results><div class=intro>${esc(d.intro||'')}</div><div class=modeline>${modeTxt} · ${d.results.length}권</div><div class=grid>${d.results.map(card).join('')}</div></div>`;
}
function openM(i){const b=LAST[i];if(!b)return;
  const star=b.rating!=null?`<span class=star>★</span> ${f5(b.rating)} · ${b.rating_count||0}명`:'';
  const loan=b.loan_count?`  |  대출 ${man(b.loan_count)}`:'';
  const page=b.pages?`  |  ${b.pages}쪽`:'';
  const kws=(b.keywords||[]).slice(0,5);
  document.getElementById('sheet').innerHTML=`<div class=top><div class=cv><img src="${esc(b.cover)}" onerror="this.style.opacity=0"></div>
    <div style="flex:1"><h2>${esc(b.title)}</h2><div class=au>${esc(b.author)} · ${esc(b.publisher||'')} · ${b.pub_year||''}</div>
    <div class=meta>${star}${loan}${page}</div></div></div>
    ${b.reason?`<div class=why>${esc(b.reason)}</div>`:''}
    <p class=desc>${esc(b.description||'')}</p>
    ${kws.length?`<div class=kws>${kws.map(k=>'<span class=kw>'+esc(k)+'</span>').join('')}</div>`:''}
    <div class=acts><button class=cta>도서관에서 빌리기</button><button class=cta2 onclick=closeM()>닫기</button></div>
    <div class=src>출처 · 별점·표지 알라딘 / 대출·키워드 정보나루(국립중앙도서관)</div>`;
  document.getElementById('ov').classList.add('on');
}
function closeM(){document.getElementById('ov').classList.remove('on');}
</script></body></html>
