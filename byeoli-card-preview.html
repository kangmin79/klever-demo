<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>별이 카드 글로우 테두리 미리보기</title>
<style>
:root{
  --bg-card:#fff; --bg-input:#f0efeb;
  --text:#1a2942; --text-sub:#475569; --text-light:#64748b; --border:#e3dfd5; --gold:#d4a93b;
}
body{margin:0;background:#cfd8e6;font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--text);padding:24px;}
.panel{max-width:430px;margin:0 auto;background:#f4f3ee;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(20,25,45,.28);}
.phead{background:linear-gradient(135deg,#1a2942,#0f1a2e);color:#fff;padding:16px 18px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;}
.phead .dot{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;}
.pbody{padding:14px;display:flex;flex-direction:column;gap:8px;}

/* 카드 — 현재 hwc-card 크기 그대로, 테두리만 은은한 글로우로 도서/논문 구분 */
.hwc-card{display:flex;gap:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:13px;padding:9px;cursor:pointer;transition:.18s;}
.hwc-card.bc-book {border-color:#a9c8ea; box-shadow:0 0 0 1px rgba(58,110,165,.10), 0 2px 14px rgba(58,110,165,.22);}
.hwc-card.bc-paper{border-color:#ecd391; box-shadow:0 0 0 1px rgba(212,169,59,.14), 0 2px 14px rgba(212,169,59,.30);}
.hwc-card.bc-book:hover {box-shadow:0 0 0 1px rgba(58,110,165,.18), 0 4px 20px rgba(58,110,165,.34);transform:translateY(-2px);}
.hwc-card.bc-paper:hover{box-shadow:0 0 0 1px rgba(212,169,59,.22), 0 4px 20px rgba(212,169,59,.42);transform:translateY(-2px);}
.hwc-cv{flex:0 0 52px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;text-align:center;padding:4px;line-height:1.25;box-shadow:0 2px 7px rgba(20,20,45,.16);}
.hwc-ci{flex:1;min-width:0;display:flex;flex-direction:column;}
.hwc-ci h4{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3;margin:0;}
.hwc-ci .au{font-size:10.5px;color:var(--text-light);margin:3px 0 5px;}
.bt-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;}
.bt-eb{background:#E1F5EE;color:#0F6E56;}.bt-pp{background:#FAEEDA;color:#633806;}.bt-sub{background:#EDE9FE;color:#5B21B6;}
.hwc-read{display:inline-flex;margin-top:5px;align-self:flex-start;padding:2px 8px;border-radius:99px;background:var(--gold);color:#1a1208;font-size:10.5px;font-weight:800;}
.note{max-width:430px;margin:14px auto 0;font-size:11.5px;color:#465; text-align:center;line-height:1.5;}
</style></head>
<body>
<div class="panel">
  <div class="phead"><span class="dot">⭐</span>별이</div>
  <div class="pbody">
    <div class="hwc-card bc-book"><div class="hwc-cv" style="background:linear-gradient(160deg,#7aa7cf,#3a6ea5)">감정의 온도</div><div class="hwc-ci"><h4>감정의 온도</h4><div class="au">김병수</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-eb">전자책</span></div><div class="hwc-read">바로 읽기</div></div></div>
    <div class="hwc-card bc-book"><div class="hwc-cv" style="background:linear-gradient(160deg,#e3a08a,#c2705a)">혼자가 편한 게…</div><div class="hwc-ci"><h4>혼자가 편한 게 아니라 상처받기 싫은 거였다</h4><div class="au">하정희</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-eb">전자책</span><span class="bt-tag bt-sub">구독</span></div><div class="hwc-read">바로 읽기</div></div></div>
    <div class="hwc-card bc-book"><div class="hwc-cv" style="background:linear-gradient(160deg,#9cc18a,#5f8a4a)">우리는…</div><div class="hwc-ci"><h4>우리는 누군가의 사랑받는 아이였다</h4><div class="au">고유</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-eb">전자책</span><span class="bt-tag bt-sub">구독</span></div><div class="hwc-read">바로 읽기</div></div></div>
    <div class="hwc-card bc-paper"><div class="hwc-cv" style="background:linear-gradient(160deg,#6b5a2d,#3d3318)">논문</div><div class="hwc-ci"><h4>청년 우울과 정서조절 전략에 관한 연구</h4><div class="au">한국심리학회 · 2023</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-pp">논문</span></div><div class="hwc-read">원문 바로보기</div></div></div>
    <div class="hwc-card bc-paper"><div class="hwc-cv" style="background:linear-gradient(160deg,#6b5a2d,#3d3318)">학위논문</div><div class="hwc-ci"><h4>정서적 고립감이 청년기 적응에 미치는 영향</h4><div class="au">국회 학술정보 · 2024</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-pp">학위논문</span></div><div class="hwc-read">원문 보기</div></div></div>
  </div>
</div>
<div class="note">크기·모양 그대로 · 테두리만 은은한 글로우 — 도서 = 블루빛 / 학술자료 = 골드빛</div>
</body></html>
