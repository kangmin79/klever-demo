<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>별이 카드 테두리 구분 미리보기</title>
<style>
:root{
  --bg:#f7f6f1; --bg-card:#fff; --bg-input:#f0efeb;
  --text:#1a2942; --text-sub:#475569; --text-light:#64748b; --border:#e3dfd5; --gold:#d4a93b;
  /* 은은한 구분 테두리 — 채도 낮춰 차분하게 */
  --edge-book:#bcd0e6;   /* 도서 = 연한 블루 */
  --edge-paper:#e6d4a6;  /* 학술자료 = 연한 샌드골드 */
}
body{margin:0;background:#eef1f6;font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--text);padding:22px;}
.wrap{max-width:430px;margin:0 auto;background:var(--bg);border-radius:18px;padding:16px;box-shadow:0 10px 40px rgba(20,25,45,.12);}

.grp{margin-bottom:16px;}.grp:last-child{margin-bottom:0;}
.grp-h{font-size:11px;font-weight:700;color:var(--text-light);margin:0 0 9px;letter-spacing:.3px;}
.grp-h em{font-style:normal;}

.hwc-cards{display:flex;flex-direction:column;gap:8px;}
/* ▼ 은은한 1px 테두리로 도서/논문 구분 */
.hwc-card{display:flex;gap:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:13px;padding:9px;cursor:pointer;transition:.16s;}
.hwc-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,25,45,.08);}
.hwc-card.bc-book {border-color:var(--edge-book);}
.hwc-card.bc-paper{border-color:var(--edge-paper);}
.hwc-cv{flex:0 0 50px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:#e7e7ec;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#9aa0ad;text-align:center;padding:4px;line-height:1.2;box-shadow:0 2px 6px rgba(20,20,45,.08);}
.hwc-ci{flex:1;min-width:0;display:flex;flex-direction:column;}
.hwc-ci h4{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3;margin:0;}
.hwc-ci .au{font-size:10.5px;color:var(--text-light);margin:3px 0 5px;}
.bt-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;}
.bt-eb{background:#E1F5EE;color:#0F6E56;}.bt-pp{background:#FAEEDA;color:#633806;}.bt-sub{background:#EDE9FE;color:#5B21B6;}
.hwc-read{display:inline-flex;align-items:center;gap:3px;margin-top:5px;align-self:flex-start;padding:2px 8px;border-radius:99px;background:var(--gold);color:#1a1208;font-size:10.5px;font-weight:800;}
.note{font-size:11px;color:var(--text-light);margin:16px 4px 2px;text-align:center;line-height:1.5;}
</style></head>
<body><div class="wrap">

  <div class="grp">
    <div class="grp-h">도서 <em>4</em></div>
    <div class="hwc-cards">
      <div class="hwc-card bc-book"><div class="hwc-cv">표지</div><div class="hwc-ci"><h4>떨림과 울림</h4><div class="au">김상욱 · 동아시아</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-eb">전자책</span></div><div class="hwc-read">바로 읽기</div></div></div>
      <div class="hwc-card bc-book"><div class="hwc-cv">표지</div><div class="hwc-ci"><h4>우주의 신비 (우주과학 다이제스트 시리즈 1)</h4><div class="au">우주과학 다이제스트</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-pp">종이책</span><span class="bt-tag bt-sub">구독</span></div><div class="hwc-read">바로 읽기</div></div></div>
      <div class="hwc-card bc-book"><div class="hwc-cv">표지</div><div class="hwc-ci"><h4>별 빛의 과학</h4><div class="au">지웅배</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-eb">전자책</span></div><div class="hwc-read">바로 읽기</div></div></div>
    </div>
  </div>

  <div class="grp">
    <div class="grp-h">학술자료 <em>2</em></div>
    <div class="hwc-cards">
      <div class="hwc-card bc-paper"><div class="hwc-cv">표지</div><div class="hwc-ci"><h4>초기 우주의 급팽창 이론에 관한 고찰</h4><div class="au">한국우주과학회 · 2023</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-pp">논문</span></div><div class="hwc-read">원문 바로보기</div></div></div>
      <div class="hwc-card bc-paper"><div class="hwc-cv">표지</div><div class="hwc-ci"><h4>외계행성 탐사 기법의 최신 동향 분석</h4><div class="au">국회 학술정보 · 2024</div><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="bt-tag bt-pp">학위논문</span></div><div class="hwc-read">원문 보기</div></div></div>
    </div>
  </div>

  <div class="note">은은한 1px 테두리 · 도서 = 연한 블루 / 학술자료 = 연한 골드</div>
</div></body></html>
