<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>별이 카드 — 데이터 보강 + CTA 다듬기</title>
<style>
:root{
  --primary:#1a2942; --accent:#3a6ea5; --gold:#d4a93b;
  --bg-card:#fff; --text:#1a2942; --text-sub:#475569; --text-light:#64748b; --border:#e3dfd5;
}
body{margin:0;background:#cfd8e6;font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--text);padding:24px;}
.panel{max-width:430px;margin:0 auto;background:#f4f3ee;border-radius:18px;padding:14px;box-shadow:0 18px 50px rgba(20,25,45,.28);}
.cap{font-size:12px;color:#465;text-align:center;margin:6px auto 16px;max-width:430px;}

.hwc-cards{display:flex;flex-direction:column;gap:9px;}
.hwc-card{display:flex;gap:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:13px;padding:10px;cursor:pointer;transition:.18s;
  border-color:#a9c8ea;box-shadow:0 0 0 1px rgba(58,110,165,.10),0 2px 14px rgba(58,110,165,.22);}
.hwc-card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(58,110,165,.18),0 5px 22px rgba(58,110,165,.34);}
.hwc-cv{flex:0 0 56px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;text-align:center;padding:4px;line-height:1.25;box-shadow:0 2px 7px rgba(20,20,45,.16);}
.hwc-ci{flex:1;min-width:0;display:flex;flex-direction:column;}
.hwc-ci h4{font-size:13px;font-weight:700;color:var(--text);line-height:1.32;margin:0;}
.au{font-size:10.5px;color:var(--text-light);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.metarow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;}
.bt-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;}
.bt-eb{background:#E1F5EE;color:#0F6E56;}.bt-pp{background:#FAEEDA;color:#633806;}.bt-sub{background:#EDE9FE;color:#5B21B6;}
.loan{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#9a8348;}
.loan b{color:#7a6534;}
/* ▼ 다듬은 CTA — 골드 알약 대신 차분한 네이비 소프트 버튼 + 화살표 */
.read{display:inline-flex;align-items:center;gap:3px;margin-top:8px;align-self:flex-start;padding:5px 12px;border-radius:9px;
  background:rgba(26,41,66,.055);color:var(--primary);font-size:11px;font-weight:700;border:1px solid rgba(26,41,66,.10);transition:.14s;}
.hwc-card:hover .read{background:var(--primary);color:#fff;border-color:var(--primary);}
.read .ar{font-size:13px;line-height:1;opacity:.7;}
</style></head>
<body>
<div class="panel">
  <div class="hwc-cards">

    <div class="hwc-card">
      <div class="hwc-cv" style="background:linear-gradient(160deg,#2b4a73,#1a2942)">떨림과 울림</div>
      <div class="hwc-ci">
        <h4>떨림과 울림</h4>
        <div class="au">김상욱 · 동아시아 · 2018</div>
        <div class="metarow"><span class="bt-tag bt-eb">전자책</span><span class="loan">대출 <b>1,687</b></span></div>
        <div class="read">바로 읽기 <span class="ar">›</span></div>
      </div>
    </div>

    <div class="hwc-card">
      <div class="hwc-cv" style="background:linear-gradient(160deg,#3a5a86,#22324f)">기원의 탐구</div>
      <div class="hwc-ci">
        <h4>기원의 탐구</h4>
        <div class="au">짐 배것 · 반니 · 2022</div>
        <div class="metarow"><span class="bt-tag bt-eb">전자책</span><span class="loan">대출 <b>79</b></span></div>
        <div class="read">바로 읽기 <span class="ar">›</span></div>
      </div>
    </div>

    <div class="hwc-card">
      <div class="hwc-cv" style="background:linear-gradient(160deg,#4a6a96,#2b3a55)">UFO</div>
      <div class="hwc-ci">
        <h4>UFO</h4>
        <div class="au">맹성렬 · 위즈덤하우스 · 2018</div>
        <div class="metarow"><span class="bt-tag bt-eb">전자책</span></div>
        <div class="read">바로 읽기 <span class="ar">›</span></div>
      </div>
    </div>

  </div>
</div>
<div class="cap">오른쪽: 저자·출판사·연도 + (있을 때만) 대출 횟수 · CTA는 네이비 소프트 버튼+화살표(호버 시 채워짐)</div>
</body></html>
