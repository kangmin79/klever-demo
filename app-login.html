<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>솔숲 로그인</title>
<!--
  솔숲 앱 로그인 창(8/22) — 앱은 이 페이지를 '시스템 인증 브라우저'로 연다(카카오 로그인 방식). 비밀번호는 앱이 보지 못한다.
  정식 연동 후: 이 페이지는 세명대 통합인증으로 바로 넘기고(학교 화면), 학교가 sso-login 으로 학번을 보내면 ret(앱 주소)로 돌아간다.
  지금(계약 전 테스트): 포털 아이디·비번을 sso-login 에 보내 서버가 포털에 1회 확인 — 화면에 '테스트 기간 한정'을 명시한다.
  ret 은 sso-login 이 허용 목록(solsup:// · exp:// · semyung.bookstar.co.kr)으로만 받는다.
-->
<style>
  :root{--ink:#1a2942;--sub:#5b6578;--light:#9aa3b2;--line:#e6e1d6;--bg:#f7f6f1;--card:#fff;--gold:#b8860b}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
  .wrap{max-width:420px;margin:0 auto;padding:40px 22px 60px}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:26px}.logo b{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo span{font-size:20px;font-weight:800}.logo small{display:block;font-size:12px;color:var(--light);font-weight:500}
  h1{font-size:21px;margin:0 0 6px}p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:22px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 6px}label:first-child{margin-top:0}
  input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}input:focus{outline:none;border-color:var(--gold)}
  button{width:100%;margin-top:18px;font:inherit;font-size:15.5px;font-weight:800;padding:14px;border:none;border-radius:12px;background:var(--ink);color:#fff}button:disabled{opacity:.5}
  .note{margin-top:14px;font-size:12px;color:var(--light);line-height:1.6}
  .test{display:inline-block;font-size:11px;font-weight:800;color:#b45309;background:#fff3dc;border-radius:6px;padding:3px 8px;margin-bottom:10px}
  .err{color:#c0392b;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><b>솔</b><div><span>솔숲</span><small>세명대학교 민송도서관</small></div></div>
  <h1>세명대 로그인</h1>
  <p>로그인하면 빌린 책 · 반납일 · 예약이 앱에 모여요.<br>로그인 정보는 학교로만 전달되고 앱에는 저장되지 않습니다.</p>
  <div class="card">
    <span class="test">테스트 기간 한정 로그인</span>
    <form id="f" method="post" action="https://api.bookstar.co.kr/functions/v1/sso-login">
      <input type="hidden" name="school" value="semyung.ac.kr">
      <input type="hidden" name="client_username" value="">
      <input type="hidden" name="ret" id="ret" value="">
      <label for="uid">포털 아이디 (학번)</label>
      <input id="uid" name="client_userid" autocomplete="username" autocapitalize="none" inputmode="text" required>
      <input type="hidden" name="portal_id" id="pid">
      <label for="pw">포털 비밀번호</label>
      <input id="pw" name="portal_pw" type="password" autocomplete="current-password" required>
      <div class="err" id="err"></div>
      <button type="submit" id="go">세명대 포털로 로그인</button>
    </form>
    <div class="note">비밀번호는 학교 포털 확인에 한 번 쓰이고 저장하지 않아요.<br>정식 연동 후에는 이 화면 대신 <b>세명대 통합인증 화면</b>이 열립니다.</div>
  </div>
</div>
<script>
  // ret(앱 복귀 주소)는 앱이 ?ret= 로 넘긴다. 없으면 웹(참나루)으로 돌아가는 기본 동작.
  var q = new URLSearchParams(location.search);
  document.getElementById('ret').value = q.get('ret') || '';
  var f = document.getElementById('f');
  f.addEventListener('submit', function(){
    document.getElementById('pid').value = document.getElementById('uid').value.trim();
    document.getElementById('go').disabled = true; document.getElementById('go').textContent = '확인 중…';
  });
  // sso-login 은 실패 시 HTML 오류 페이지(400)를 준다 — 폼 제출이라 그대로 보인다(뒤로 가기로 재시도)
</script>
</body>
</html>
